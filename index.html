<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업스테이션 채용공고</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #f8f8f8;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .detail-container {
      width: 100%;
      max-width: 860px; /* 상세페이지 최대 너비 설정 */
      background: #ffffff;
    }
    .detail-container img {
      width: 100%;
      display: block; /* 이미지 사이 여백 제거 */
      height: auto;
    }
    /* 투명 클릭 영역 공통 스타일 */
        .brand-link-box {
            position: absolute;
            display: block;
            /* 위치 조절 시 확인해보시려면 아래 background 주석을 해제하세요 */
            /* background: rgba(255, 0, 0, 0.3); */
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
        }

        /* 1. SMILY METHOD 박스 (첫 번째 빨간 박스) */
        .link-smily {
            top: 48.5%;      /* 위에서의 위치 (%) */
            left: 7.5%;      /* 왼쪽에서의 위치 (%) */
            width: 32.5%;    /* 박스 너비 (%) */
            height: 12.0%;   /* 박스 높이 (%) */
        }

        /* 2. MINOBIO 박스 (두 번째 빨간 박스) */
        .link-minobio {
            top: 64.5%;
            left: 7.5%;
            width: 32.5%;
            height: 12.0%;
        }

        /* 3. FANDEAL 박스 (세 번째 빨간 박스) */
        .link-fandeal {
            top: 80.5%;
            left: 7.5%;
            width: 32.5%;
            height: 12.0%;
        }
  </style>
</head>
<body>
  <div class="detail-container">
    <!-- 업로드한 이미지 파일명에 맞게 src 수정 -->
    <img src="section1.jpg" alt="업스테이션 인트로">
    <div class="brand-section-container">
        <!-- 원본 이미지 파일명을 src에 넣으세요 -->
        <img src="section2.jpg" alt="About US 회사 소개">

        <!-- 빨간 박스 영역 하이퍼링크 -->
        <a href="https://SMILY_METHOD_URL.com" target="_blank" class="brand-link-box link-smily" title="SMILY METHOD 웹페이지 바로가기"></a>
        <a href="https://MINOBIO_URL.com" target="_blank" class="brand-link-box link-minobio" title="MINOBIO 웹페이지 바로가기"></a>
        <a href="https://FANDEAL_URL.com" target="_blank" class="brand-link-box link-fandeal" title="FANDEAL 웹페이지 바로가기"></a>
    </div>
    <img src="section3.jpg" alt="업스테이션 채용정보">
  </div>
</body>
</html>
